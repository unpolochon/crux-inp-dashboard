<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CrUX — Le Parisien</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #111217; --panel: #181b1f; --line: #2c3235; --text: #d8d9da; --muted: #8e9297;
    --good: #56a64b; --ni: #e0b400; --poor: #e02f44;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--text);
         font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 28px 0 10px; font-weight: 500; }
  .sub { color: var(--muted); font-size: 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
  .stat { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 3px;
          overflow: hidden; }
  .stat header { background: var(--panel); padding: 5px 8px; font-size: 11px; color: var(--muted);
                 white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat .val { flex: 1; align-content: center; padding: 18px 8px; text-align: center; font-size: 38px;
               font-weight: 500; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.35); }
  .stat .val small { font-size: 15px; opacity: .8; margin-left: 3px; }
  .stat.empty .val { background: var(--panel); color: var(--muted); font-size: 15px; }
  .bar { display: flex; height: 26px; border-radius: 3px; overflow: hidden; border: 1px solid var(--line); }
  .bar span { display: flex; align-items: center; justify-content: center; font-size: 11px; color: #000; }
  .row { display: grid; grid-template-columns: 190px 1fr; gap: 10px; align-items: center; margin-bottom: 6px; }
  .row > .lbl { font-size: 12px; color: var(--muted); text-align: right; }
  .legend { display: flex; gap: 14px; font-size: 11px; color: var(--muted); margin-top: 8px; }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; }
  .grid-label { margin: 0 0 6px; }
  .grid + .grid-label { margin-top: 14px; }
  .panel { border: 1px solid var(--line); border-radius: 3px; padding: 10px; background: var(--panel); }
  svg text { fill: var(--muted); font-size: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { text-align: left; color: var(--muted); font-weight: 500; padding: 5px 8px;
       border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 5px 8px; border-bottom: 1px solid var(--line); }
  tbody tr:hover { background: #1f2327; }
  td.num { text-align: right; white-space: nowrap; }
  td.inp { text-align: right; font-weight: 500; color: #fff; }
  td a { color: var(--text); text-decoration: none; }
  td a:hover { text-decoration: underline; }
  .article-cell { min-width: 260px; }
  .article-link { display: inline; }
  .source-chip { display: inline-block; margin-left: 6px; padding: 1px 5px; border: 1px solid #45617a;
                 border-radius: 2px; color: #a8c5df; font: 9px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
                 letter-spacing: .06em; text-transform: uppercase; vertical-align: 1px; }
  .detail-row:hover { background: transparent; }
  .detail-cell { padding: 0 8px 5px; }
  .rum-details { margin-top: -1px; }
  .rum-details summary { width: max-content; color: #a8c5df; cursor: pointer; font-size: 11px;
                         list-style-position: outside; }
  .rum-details summary:hover { color: #d6e9fa; }
  .rum-details summary:focus-visible { outline: 2px solid #8ab8ff; outline-offset: 2px; }
  .rum-box { margin: 8px 0 4px; padding: 10px; border-left: 2px solid #45617a; background: #14171b; }
  .rum-head { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-bottom: 9px; color: var(--muted); }
  .rum-head strong { color: var(--text); font-weight: 600; }
  .phase-bar { display: flex; min-width: 240px; height: 24px; overflow: hidden; border: 1px solid var(--line);
               border-radius: 3px; background: #252a2f; }
  .phase-bar span { display: flex; align-items: center; justify-content: center; min-width: 0; overflow: hidden;
                    color: #fff; font-size: 10px; white-space: nowrap; }
  .phase-input { background: #355b78; }
  .phase-processing { background: #5d5278; }
  .phase-presentation { background: #696044; }
  .phase-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 5px 0 11px; color: var(--muted); font-size: 10px; }
  .phase-legend i { display: inline-block; width: 8px; height: 8px; margin-right: 4px; border-radius: 1px; }
  .elements-title { margin-bottom: 3px; color: var(--muted); font-size: 10px; text-transform: uppercase;
                    letter-spacing: .05em; }
  .elements-table { table-layout: fixed; font-size: 11px; }
  .elements-table th, .elements-table td { padding: 4px 6px; }
  .elements-table th:nth-child(2), .elements-table td:nth-child(2) { width: 74px; text-align: right; }
  .elements-table th:nth-child(3), .elements-table td:nth-child(3) { width: 92px; text-align: right; }
  .selector { overflow-wrap: anywhere; color: #b9bdc2; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .chart-tooltip {
    position: absolute; pointer-events: none; background: #1f2327; border: 1px solid #3a3f44;
    border-radius: 3px; padding: 4px 8px; font-size: 11px; white-space: nowrap; z-index: 10;
    transform: translate(-50%, -100%); margin-top: -8px;
  }
  .chart-tooltip strong { color: #fff; }
  .chart-tooltip span { color: var(--muted); margin-left: 6px; }
  @media (max-width: 620px) {
    body { padding: 10px; }
    .panel { padding: 6px; }
    .row { grid-template-columns: 105px 1fr; gap: 6px; }
    .article-cell { min-width: 0; }
    .articles-table .secondary { display: none; }
    .articles-table th, .articles-table td { padding: 6px; }
    .articles-table th:nth-child(2) { white-space: normal; text-align: center !important; }
    .detail-cell { padding: 0 6px 5px; }
    .rum-box { padding: 8px; }
    .rum-head { gap: 4px 12px; }
    .phase-bar { min-width: 0; }
    .phase-bar span { font-size: 9px; }
    .elements-table th:nth-child(2), .elements-table td:nth-child(2) { width: 44px; }
    .elements-table th:nth-child(3), .elements-table td:nth-child(3) { width: 68px; }
  }
</style>
</head>
<body>
<h1>INP mobile — www.leparisien.fr</h1>
<div class="sub" id="meta"></div>
<div id="view"></div>

<script type="module">
// ponytail: dashboard recentré INP mobile uniquement, plus besoin de multi-métriques/onglets.
const METRIC = { key: 'interaction_to_next_paint', label: 'INP', unit: 'ms', good: 200, poor: 500,
  desc: 'Interaction to Next Paint — réactivité perçue. ≤200 ms Bon · ≤500 ms À améliorer · >500 ms Mauvais.' };

const d = await (await fetch('data.json?' + Date.now())).json();
const color = (m, v) => (v == null ? '#3a3f44' : v <= m.good ? 'var(--good)' : v <= m.poor ? 'var(--ni)' : 'var(--poor)');
const fmt = (m, v) => (v == null ? '—' : m.unit === 'ms' ? Math.round(v) : v.toFixed(2));
const pct = (v) => (v == null ? 0 : v * 100);
const esc = (value) => String(value ?? '').replace(/[&<>'"]/g, (char) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[char]);

const stat = (title, m, v, empty = 'pas de données CrUX') => v == null
  ? `<div class="stat empty"><header>${title}</header><div class="val">${empty}</div></div>`
  : `<div class="stat"><header>${title}</header>
       <div class="val" style="background:${color(m, v)}">${fmt(m, v)}${m.unit ? `<small>${m.unit}</small>` : ''}</div></div>`;

const distro = (label, x) => {
  if (!x || x.good == null) return '';
  const seg = (v, c) => (pct(v) < 4 ? `<span style="width:${pct(v)}%;background:${c}"></span>`
    : `<span style="width:${pct(v)}%;background:${c}">${pct(v).toFixed(1)}%</span>`);
  return `<div class="row"><div class="lbl">${label}</div><div class="bar">
    ${seg(x.good, 'var(--good)')}${seg(x.ni, 'var(--ni)')}${seg(x.poor, 'var(--poor)')}</div></div>`;
};

let _chartPts = null, _chartMetric = null, _chartGeom = null;

// Sparkline p75 sur les 25 derniers relevés hebdo de l'API history.
function chart(series, m) {
  const pts = series.filter((p) => p.p75 != null);
  if (pts.length < 2) return '';
  const W = 900, H = 170, P = 34;
  const vs = pts.map((p) => p.p75);
  // Échelle sur les données seules + 12% de marge : sinon un seuil très au-dessus
  // (ex. desktop 70 ms vs seuil 200) écrase la courbe en bas du graphe.
  const min = Math.min(...vs), max = Math.max(...vs), pad = (max - min || max || 1) * 0.12;
  const lo = min - pad, hi = max + pad;
  const x = (i) => P + (i * (W - P - 26)) / (pts.length - 1);
  const y = (v) => H - 22 - ((v - lo) / (hi - lo || 1)) * (H - 44);
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.p75).toFixed(1)}`).join('');
  const ticks = [lo, (lo + hi) / 2, hi].map((v) =>
    `<line x1="${P}" x2="${W - 26}" y1="${y(v)}" y2="${y(v)}" stroke="#2c3235"/>
     <text x="4" y="${y(v) + 3}">${fmt(m, v)}</text>`).join('');
  // Seuil "Bon" : affiché seulement s'il tombe dans la plage visible.
  const thr = m.good >= lo && m.good <= hi
    ? `<line x1="${P}" x2="${W - 26}" y1="${y(m.good)}" y2="${y(m.good)}" stroke="var(--good)" stroke-dasharray="4 3"/>` : '';
  const labels = pts.map((p, i) => (i % 4 === 0 || i === pts.length - 1)
    ? `<text x="${x(i)}" y="${H - 5}" text-anchor="middle">${p.date.slice(5)}</text>` : '').join('');
  const dots = pts.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.p75)}" r="2.5" fill="${color(m, p.p75)}"/>`).join('');
  _chartPts = pts.map((p, i) => ({ ...p, sx: x(i), sy: y(p.p75) }));
  _chartMetric = m;
  _chartGeom = { W, H, P };
  return `<div class="panel chart-panel" style="position:relative"><svg viewBox="0 0 ${W} ${H}" width="100%" class="chart-svg">
    ${thr}${ticks}<path d="${line}" fill="none" stroke="#8ab8ff" stroke-width="1.8"/>${dots}${labels}
    <g class="chart-hover" opacity="0" pointer-events="none">
      <line class="chart-guide" x1="0" y1="${P}" x2="0" y2="${H - 22}" stroke="#8ab8ff" stroke-width="1" stroke-dasharray="3 2"/>
      <circle class="chart-hl" cx="0" cy="0" r="5" fill="#8ab8ff" stroke="#111217" stroke-width="2"/>
    </g>
    <rect class="chart-overlay" x="${P}" y="0" width="${W - P - 26}" height="${H}" fill="transparent" style="cursor:crosshair"/>
  </svg><div class="chart-tooltip" style="display:none"></div></div>`;
}

function setupChartHover() {
  const panel = document.querySelector('.chart-panel');
  const svg = document.querySelector('.chart-svg');
  if (!svg || !_chartPts) return;
  const { W, H } = _chartGeom;
  const m = _chartMetric;
  const hover = svg.querySelector('.chart-hover');
  const guide = svg.querySelector('.chart-guide');
  const hl = svg.querySelector('.chart-hl');
  const tooltip = panel.querySelector('.chart-tooltip');

  svg.addEventListener('mousemove', (e) => {
    const rect = svg.getBoundingClientRect();
    const mx = ((e.clientX - rect.left) / rect.width) * W;
    let nearest = 0, minDist = Infinity;
    for (let i = 0; i < _chartPts.length; i++) {
      const dist = Math.abs(_chartPts[i].sx - mx);
      if (dist < minDist) { minDist = dist; nearest = i; }
    }
    const p = _chartPts[nearest];
    guide.setAttribute('x1', p.sx); guide.setAttribute('x2', p.sx);
    hl.setAttribute('cx', p.sx); hl.setAttribute('cy', p.sy);
    hover.setAttribute('opacity', '1');
    const tx = (p.sx / W) * rect.width;
    const ty = (p.sy / H) * rect.height;
    tooltip.style.display = 'block';
    tooltip.style.left = tx + 'px';
    tooltip.style.top = ty + 'px';
    tooltip.innerHTML = `<strong>${fmt(m, p.p75)}${m.unit ? ' ' + m.unit : ''}</strong><span>${p.date}</span>`;
  });

  svg.addEventListener('mouseleave', () => {
    hover.setAttribute('opacity', '0');
    tooltip.style.display = 'none';
  });
}

// Tableau des articles J-2 triés par INP décroissant (les pires en tête).
function table(rows, m) {
  if (!rows?.length) return '<div class="panel sub">pas d’articles avec données CrUX</div>';
  const p = (v) => (v == null ? '—' : (v * 100).toFixed(0) + ' %');
  const day = (s) => (s ? s.slice(0, 10).split('-').reverse().join('/') : '—');
  const rum = (x) => {
    const phases = x.phases ?? {};
    const phaseRows = [
      ['Délai d’entrée', phases.input, 'phase-input'],
      ['Traitement', phases.processing, 'phase-processing'],
      ['Présentation', phases.presentation, 'phase-presentation'],
    ];
    const total = phaseRows.reduce((sum, [, value]) => sum + (value ?? 0), 0);
    const bar = total ? phaseRows.map(([label, value, cls]) =>
      `<span class="${cls}" style="width:${((value ?? 0) / total) * 100}%" title="${label} : ${value ?? 0} ms">${value ?? 0} ms</span>`).join('') : '';
    const elements = x.elements?.length
      ? `<div class="elements-title">Éléments des interactions mesurées</div><table class="elements-table">
          <thead><tr><th>Sélecteur</th><th>Vues</th><th>INP médian</th></tr></thead>
          <tbody>${x.elements.map((element) => `<tr><td class="selector" title="${esc(element.selector)}">${esc(element.selector)}</td>
            <td>${element.n}</td><td>${element.inpMedian} ms</td></tr>`).join('')}</tbody></table>`
      : '<div class="sub">aucun sélecteur d’interaction disponible</div>';
    return `<details class="rum-details"><summary>Voir l’attribution terrain</summary><div class="rum-box">
      <div class="rum-head"><span><strong>${x.n.toLocaleString('fr-FR')}</strong> pages vues avec INP</span>
        <span>INP terrain p75 <strong>${x.inpP75} ms</strong></span>
        <span>Phases <strong>médianes</strong></span></div>
      <div class="phase-bar" aria-label="Phases médianes de l’INP">${bar}</div>
      <div class="phase-legend">${phaseRows.map(([label, value, cls]) =>
        `<span><i class="${cls}"></i>${label} ${value ?? '—'} ms</span>`).join('')}</div>${elements}</div></details>`;
  };
  const tr = (a) => `<tr class="article-row">
    <td class="article-cell"><a class="article-link" href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.title ?? a.url)}</a>
      ${a.rum ? '<span class="source-chip">rum</span>' : ''}</td>
    <td class="inp" style="background:${color(m, a.p75)}">${Math.round(a.p75)}</td>
    <td class="num secondary">${p(a.good)}</td><td class="num secondary">${p(a.ni)}</td><td class="num secondary">${p(a.poor)}</td>
    <td class="num secondary">${day(a.published)}</td></tr>
    ${a.rum ? `<tr class="detail-row"><td class="detail-cell" colspan="6">${rum(a.rum)}</td></tr>` : ''}`;
  return `<div class="panel"><table class="articles-table">
    <thead><tr><th>Article</th><th style="text-align:right">INP p75 (mobile)</th>
      <th class="secondary" style="text-align:right">% Good</th><th class="secondary" style="text-align:right">% NI</th>
      <th class="secondary" style="text-align:right">% Poor</th><th class="secondary" style="text-align:right">Publié le</th></tr></thead>
    <tbody>${rows.map(tr).join('')}</tbody></table></div>`;
}

function render() {
  const m = METRIC, key = m.key;
  const o = d.origins;
  const p75Label = (x) => x.id === 'all' ? `${m.label} p75 articles J-2` : `Articles ${x.label} — p75`;

  const globalCards = [
    stat(`${m.label} global mobile (origine)`, m, o.PHONE?.[key]?.p75),
    ...d.pages.map((p) => stat(`${p.label} — global mobile`, m, p.metrics?.[key]?.p75)),
  ];
  const p75Cards = d.articleGroups.map((x) =>
    stat(`${p75Label(x)} (n=${x.metrics[key]?.samples ?? 0})`, m, x.metrics[key]?.p75));

  // Vue terrain SpeedCurve : mêmes périmètres que les deux rangées CrUX, mais mesure réelle
  // sur les pages vues des jours collectés. n = nombre de pages vues avec un INP.
  const rumWindow = d.rumDates?.length
    ? d.rumDates.map((date) => `${date.slice(6, 8)}/${date.slice(4, 6)}`).join(' + ')
    : '';
  // Sous ce seuil un p75 n'est pas stable : on affiche la valeur pour information, mais en carte
  // neutre plutôt qu'en vert franc, sinon 99 ms sur 6 pages vues se lit comme un bon score.
  const RUM_MIN_VIEWS = 50;
  const rumSolid = (x) => x?.inpP75 != null && x.n >= RUM_MIN_VIEWS;
  const rumCard = (title, x) => {
    const label = `${title} (n=${(x?.n ?? 0).toLocaleString('fr-FR')})`;
    if (rumSolid(x)) return stat(label, m, x.inpP75);
    return stat(label, m, null,
      x?.inpP75 == null ? 'pas de données terrain' : `${x.inpP75} ms · échantillon trop faible`);
  };
  const rumPageCards = d.pages.map((p) => rumCard(p.label, p.rum));
  const rumGroupCards = d.articleGroups.map((x) => rumCard(`Articles ${x.label}`, x.rum));
  // Une distribution calculée sur quelques pages vues n'a pas de sens : même seuil que les cartes.
  const rumDistro = (label, x) => (rumSolid(x) ? distro(label, x) : '');

  // Ajoute le p75 courant (queryRecord) en dernier point : sinon le graphe ne montre
  // que l'historique CrUX qui prend ~7 j de retard sur la mesure actuelle.
  const histSeries = [...(d.history.PHONE?.[key] ?? [])];
  const curP75 = o.PHONE?.[key]?.p75;
  if (curP75 != null) {
    const today = d.collectedAt.slice(0, 10);
    if (histSeries[histSeries.length - 1]?.date !== today) {
      histSeries.push({ date: today, p75: curP75,
        good: o.PHONE?.[key]?.good, ni: o.PHONE?.[key]?.ni, poor: o.PHONE?.[key]?.poor });
    }
  }

  const legend = `<div class="legend"><span><i style="background:var(--good)"></i>Good</span>
    <span><i style="background:var(--ni)"></i>Needs improvement</span>
    <span><i style="background:var(--poor)"></i>Poor</span></div>`;

  document.getElementById('view').innerHTML = `
    <div class="sub" style="margin-bottom:10px">${m.desc}</div>
    <h2>Vue globale — mesure CrUX directe par page</h2>
    <div class="grid">${globalCards.join('')}</div>
    <h2>Vue p75 — agrégat des articles par rubrique</h2>
    <div class="grid">${p75Cards.join('')}</div>
    ${d.rumDates?.length ? `
    <h2>Vue terrain SpeedCurve — INP p75 des pages vues réelles (${rumWindow})</h2>
    <div class="sub grid-label">Pages rubrique</div>
    <div class="grid">${rumPageCards.join('')}</div>
    <div class="sub grid-label">Pages article, agrégées par rubrique</div>
    <div class="grid">${rumGroupCards.join('')}</div>` : ''}
    <h2>Distribution Good / NI / Poor — CrUX</h2>
    <div class="panel">
      ${distro('Origine mobile', o.PHONE?.[key])}
      ${d.pages.map((p) => distro(`${p.label} (global)`, p.metrics?.[key])).join('')}
      ${d.articleGroups.map((x) => distro(`Articles ${x.label} (p75)`, x.metrics[key])).join('')}
      ${legend}
    </div>
    ${d.rumDates?.length ? `
    <h2>Distribution Good / NI / Poor — terrain SpeedCurve (${rumWindow})</h2>
    <div class="panel">
      ${d.pages.map((p) => rumDistro(p.label, p.rum)).join('')}
      ${d.articleGroups.map((x) => rumDistro(`Articles ${x.label}`, x.rum)).join('')}
      ${legend}
    </div>` : ''}
    <h2>Historique p75 — origine mobile (relevés hebdo, 28 j glissants)</h2>
    ${chart(histSeries, m) || '<div class="panel sub">pas d\'historique</div>'}
    <h2>Articles — INP p75 par article (${d.articles?.length ?? 0} avec données CrUX, pires en tête)</h2>
    ${table(d.articles, m)}`;
  setupChartHover();
}

document.getElementById('meta').textContent =
  `Collecte ${new Date(d.collectedAt).toLocaleString('fr-FR')} · articles J-2 du ${d.articlesDate} · sources CrUX API (p75 sur 28 jours)${d.rumDates?.length ? ` + SpeedCurve RUM (${d.rumDates.map((date) => `${date.slice(6, 8)}/${date.slice(4, 6)}`).join(' et ')})` : ''}`;
render();
</script>
</body>
</html>
